<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherry&Eason Pet - 圖片快速上傳工具</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fdf5e6; color: #5C3A00; padding: 40px 20px; display: flex; justify-content: center; }
        .upload-container { background: white; padding: 30px; width: 100%; max-width: 450px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        .drop-zone { border: 2px dashed #FFD27F; padding: 30px; border-radius: 12px; background: #fffcf7; cursor: pointer; }
        .preview-img { max-width: 100%; max-height: 200px; margin-top: 15px; border-radius: 8px; display: none; margin-left: auto; margin-right: auto; }
        button { width: 100%; padding: 14px; background: #FFD27F; border: none; border-radius: 25px; font-size: 1.1rem; font-weight: bold; color: #5C3A00; cursor: pointer; margin-top: 20px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .result-box { margin-top: 20px; display: none; }
        .url-display { width: 100%; padding: 10px; background: #f4f4f4; border: 1px solid #ddd; border-radius: 6px; font-size: 0.85rem; box-sizing: border-box; text-align: left; word-break: break-all; max-height: 100px; overflow-y: auto; }
        #status-msg { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
<div class="upload-container">
    <h2>🐾 圖片快速上傳工具</h2>
    <p style="font-size: 0.9rem; color: #8B7355;">選取照片 ➔ 自動處理 ➔ 自動複製網址 ➔ 貼回 Sheets</p>
    <div class="drop-zone" onclick="document.getElementById('file-input').click()">
        <span style="font-size: 2.5rem;">📷</span>
        <p style="margin: 10px 0 0 0; font-weight: bold;">點擊選擇相簿照片</p>
        <input type="file" id="file-input" accept="image/*" style="display:none;">
        <img id="image-preview" class="preview-img" alt="圖片預覽">
    </div>
    <button id="upload-btn" disabled>⚡ 開始轉換圖片網址</button>
    <div id="status-msg"></div>
    <div class="result-box" id="result-box">
        <p style="font-weight: bold; text-align: left; margin-bottom: 5px;">圖片網址（已自動複製）：</p>
        <div class="url-display" id="url-output"></div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('file-input');
    const previewImg = document.getElementById('image-preview');
    const uploadBtn = document.getElementById('upload-btn');
    const statusMsg = document.getElementById('status-msg');
    const resultBox = document.getElementById('result-box');
    const urlOutput = document.getElementById('url-output');
    let selectedFile = null;

    fileInput.addEventListener('change', e => {
        selectedFile = e.target.files[0];
        if (selectedFile) {
            const reader = new FileReader();
            reader.onload = e => { 
                previewImg.src = e.target.result; 
                previewImg.style.display = 'block'; 
                uploadBtn.disabled = false; 
                statusMsg.innerText = ""; 
                resultBox.style.display = 'none'; 
            };
            reader.readAsDataURL(selectedFile);
        }
    });

    uploadBtn.addEventListener('click', async () => {
        if (!selectedFile) return;
        uploadBtn.disabled = true;
        statusMsg.style.color = "#5C3A00";
        statusMsg.innerText = "正在處理圖片...";

        // 嘗試方案：透過 tmpfiles 雲端上傳 (完全跨網域相容)
        const formData = new FormData();
        formData.append('file', selectedFile);

        try {
            const res = await fetch('https://tmpfiles.org/api/v1/upload', {
                method: 'POST',
                body: formData
            });

            const data = await res.json();

            if (data.status === "success" && data.data && data.data.url) {
                // 將產生的網址轉成直連圖片網址
                const rawUrl = data.data.url;
                const directUrl = rawUrl.replace('tmpfiles.org/', 'tmpfiles.org/dl/');

                urlOutput.innerText = directUrl;
                resultBox.style.display = 'block';
                statusMsg.style.color = "green";
                statusMsg.innerText = "🎉 轉換成功！網址已自動複製到剪貼簿。";

                copyToClipboard(directUrl);
            } else {
                throw new Error("上傳失敗");
            }
        } catch (err) {
            console.warn("第三方伺服器失敗，啟用備用本地 Base64 轉換機制...");
            
            // 備援機制：如果連外部 API 全被擋，直接轉 Base64
            const reader = new FileReader();
            reader.onload = function (e) {
                const base64Url = e.target.result;
                urlOutput.innerText = base64Url;
                resultBox.style.display = 'block';
                statusMsg.style.color = "green";
                statusMsg.innerText = "🎉 圖片已轉為安全網址格式，已複製到剪貼簿！";
                copyToClipboard(base64Url);
            };
            reader.readAsDataURL(selectedFile);
        } finally {
            uploadBtn.disabled = false;
        }
    });

    function copyToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text);
        } else {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
        }
    }
</script>
</body>
</html>
