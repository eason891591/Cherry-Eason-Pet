<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherry&Eason Pet - 圖片快速上傳工具</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fdf5e6; color: #5C3A00; padding: 40px 20px; display: flex; justify-content: center; }
        .upload-container { background: white; padding: 30px; width: 100%; max-width: 450px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        .drop-zone { border: 2px dashed #FFD27F; padding: 30px; border-radius: 12px; background: #fffcf7; cursor: pointer; }
        .preview-img { max-width: 100%; max-height: 200px; margin-top: 15px; border-radius: 8px; display: none; margin-left: auto; margin-right: auto; }
        button { width: 100%; padding: 14px; background: #FFD27F; border: none; border-radius: 25px; font-size: 1.1rem; font-weight: bold; color: #5C3A00; cursor: pointer; margin-top: 20px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .result-box { margin-top: 20px; display: none; }
        .url-display { width: 100%; padding: 10px; background: #f4f4f4; border: 1px solid #ddd; border-radius: 6px; font-size: 0.85rem; box-sizing: border-box; text-align: left; word-break: break-all; }
        #status-msg { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
<div class="upload-container">
    <h2>🐾 圖片快速上傳工具</h2>
    <p style="font-size: 0.9rem; color: #8B7355;">選取照片 ➔ 自動上傳至 Google Drive ➔ 自動複製網址</p>
    <div class="drop-zone" onclick="document.getElementById('file-input').click()">
        <span style="font-size: 2.5rem;">📷</span>
        <p style="margin: 10px 0 0 0; font-weight: bold;">點擊選擇相簿照片</p>
        <input type="file" id="file-input" accept="image/*" style="display:none;">
        <img id="image-preview" class="preview-img" alt="圖片預覽">
    </div>
    <button id="upload-btn" disabled>⚡ 開始上傳並複製網址</button>
    <div id="status-msg"></div>
    <div class="result-box" id="result-box">
        <p style="font-weight: bold; text-align: left; margin-bottom: 5px;">圖片網址（已自動複製）：</p>
        <div class="url-display" id="url-output"></div>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyIieOIBosEqEdQayy8lrUVk2bZHPxv0nBQS_Txndo7_94kQQA05WGOyNXpvXB5vxj-/exec"; 

    const fileInput = document.getElementById('file-input');
    const previewImg = document.getElementById('image-preview');
    const uploadBtn = document.getElementById('upload-btn');
    const statusMsg = document.getElementById('status-msg');
    const resultBox = document.getElementById('result-box');
    const urlOutput = document.getElementById('url-output');
    let selectedFile = null;

    fileInput.addEventListener('change', e => {
        selectedFile = e.target.files[0];
        if (selectedFile) {
            const reader = new FileReader();
            reader.onload = e => { 
                previewImg.src = e.target.result; 
                previewImg.style.display = 'block'; 
                uploadBtn.disabled = false; 
                statusMsg.innerText = ""; 
                resultBox.style.display = 'none'; 
            };
            reader.readAsDataURL(selectedFile);
        }
    });

    uploadBtn.addEventListener('click', () => {
        if (!selectedFile) return;
        uploadBtn.disabled = true;
        statusMsg.style.color = "#5C3A00";
        statusMsg.innerText = "正在處理並上傳至雲端...";

        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Data = e.target.result.split(',')[1];
            
            const payload = {
                filename: selectedFile.name,
                mimeType: selectedFile.type,
                fileData: base64Data
            };

            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    urlOutput.innerText = data.url;
                    resultBox.style.display = 'block';
                    statusMsg.style.color = "green";
                    statusMsg.innerText = "🎉 上傳成功！圖片網址已複製。";
                    copyToClipboard(data.url);
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(err => {
                console.error(err);
                statusMsg.style.color = "red";
                statusMsg.innerText = "❌ 上傳失敗，請檢查 GAS 網址與權限！";
            })
            .finally(() => {
                uploadBtn.disabled = false;
            });
        };
        reader.readAsDataURL(selectedFile);
    });

    function copyToClipboard(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try { document.execCommand('copy'); } catch (err) {}
        document.body.removeChild(textarea);
    }
</script>
</body>
</html>
