<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品快速上傳管理系統</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fdf5e6; color: #5C3A00; padding: 30px 15px; display: flex; justify-content: center; }
    .card { background: white; padding: 30px; border-radius: 16px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); box-sizing: border-box; }
    h2 { text-align: center; margin-top: 0; color: #5C3A00; }
    .form-group { margin-bottom: 15px; text-align: left; }
    label { font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 5px; }
    input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; background-color: #fff; }
    .drop-zone { border: 2px dashed #FFD27F; padding: 20px; border-radius: 12px; background: #fffcf7; text-align: center; cursor: pointer; margin-top: 5px; }
    #preview { max-width: 100%; max-height: 180px; margin-top: 10px; display: none; border-radius: 8px; margin-left: auto; margin-right: auto; }
    button { width: 100%; padding: 14px; background: #FFD27F; border: none; border-radius: 25px; font-size: 1.05rem; font-weight: bold; color: #5C3A00; cursor: pointer; margin-top: 15px; }
    button:disabled { background: #e0e0e0; color: #aaa; cursor: not-allowed; }
    #status-msg { text-align: center; font-weight: bold; margin-top: 15px; font-size: 0.95rem; }
  </style>
</head>
<body>

<div class="card">
  <h2>🐾 新增商品至表單</h2>
  
  <!-- 1. 商品分類 (新增) -->
  <div class="form-group">
    <label>商品分類：</label>
    <select id="p-category">
      <option value="dog">🐶 狗狗專區 (dog)</option>
      <option value="cat">🐱 貓貓專區 (cat)</option>
      <option value="all">🐾 通用商品 (all)</option>
    </select>
  </div>

  <!-- 2. 商品名稱 -->
  <div class="form-group">
    <label>商品名稱：</label>
    <input type="text" id="p-name" placeholder="例如：美味關係小不點饅頭">
  </div>

  <!-- 3. 價格 -->
  <div class="form-group">
    <label>價格 (NT$)：</label>
    <input type="number" id="p-price" placeholder="例如：50">
  </div>

  <!-- 4. 口味 / 規格 (新增 - 關鍵修正) -->
  <div class="form-group">
    <label>口味 / 規格 (多個請用半形逗號隔開)：</label>
    <input type="text" id="p-variants" placeholder="例如：牛奶DHA,起司+鈣,草莓,蘋果,綜合">
  </div>

  <!-- 5. 商品描述 -->
  <div class="form-group">
    <label>商品描述 (選填)：</label>
    <textarea id="p-desc" rows="2" placeholder="簡短說明商品特色..."></textarea>
  </div>

  <!-- 6. 商品照片 -->
  <div class="form-group">
    <label>商品照片：</label>
    <div class="drop-zone" onclick="document.getElementById('file-input').click()">
      <span style="font-size:2rem;">📷</span>
      <p style="margin:5px 0 0 0; font-size:0.9rem; font-weight:bold;">點擊選擇照片</p>
      <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="handleFile(this)">
      <img id="preview" alt="預覽圖">
    </div>
  </div>

  <button id="sub-btn" onclick="uploadAndSave()" disabled>⚡ 新增商品並自動寫入 Google 表單</button>
  <div id="status-msg"></div>
</div>

<script>
  // ⚠️ Google Apps Script 部署 Web App 網址
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlTRxj5TleEN2-SXV68FRBGoWGMC_3bW3UAwi-X9DqZT1ABpCYFf8M3exy2ZReUJ6z/exec"; 

  let compressedBase64 = "";
  let fileName = "";
  let fileType = "";

  function handleFile(input) {
    const file = input.files[0];
    if (!file) return;
    fileName = file.name;
    fileType = file.type || "image/jpeg";

    const msg = document.getElementById('status-msg');
    msg.style.color = '#5C3A00';
    msg.innerText = '正在最佳化照片尺寸...';

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const maxDim = 1000;
        let width = img.width;
        let height = img.height;

        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        compressedBase64 = dataUrl.split(',')[1];

        const preview = document.getElementById('preview');
        preview.src = dataUrl;
        preview.style.display = 'block';
        document.getElementById('sub-btn').disabled = false;
        msg.innerText = '✅ 照片已準備就緒！';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function uploadAndSave() {
    const category = document.getElementById('p-category').value;
    const name = document.getElementById('p-name').value.trim();
    const price = document.getElementById('p-price').value.trim();
    const variants = document.getElementById('p-variants').value.trim();
    const desc = document.getElementById('p-desc').value.trim();
    
    const btn = document.getElementById('sub-btn');
    const msg = document.getElementById('status-msg');

    if (!name || !price) {
      alert('請填寫商品名稱與價格！');
      return;
    }

    btn.disabled = true;
    msg.style.color = '#5C3A00';
    msg.innerText = '正在自動處理並寫入 Google 表單...';

    // 打包包含分類 (category) 與口味 (variants) 的 6 大欄位
    const payload = {
      action: 'addProduct',
      category: category,
      name: name,
      price: price,
      variants: variants,
      description: desc,
      imageBase64: compressedBase64,
      imageName: fileName,
      imageType: fileType
    };

    try {
      const res = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' }, // 防止 CORS preflight 限制
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.status === 'success') {
        msg.style.color = 'green';
        msg.innerText = '🎉 成功！商品資料與圖片已自動寫入 Google 試算表！';
        
        // 清空欄位
        document.getElementById('p-name').value = '';
        document.getElementById('p-price').value = '';
        document.getElementById('p-variants').value = '';
        document.getElementById('p-desc').value = '';
        document.getElementById('preview').style.display = 'none';
        compressedBase64 = '';
      } else {
        throw new Error(data.message || '儲存失敗');
      }
    } catch (err) {
      console.error(err);
      msg.style.color = 'red';
      msg.innerText = '❌ 處理失敗：' + err.message;
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
