<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherry&Eason Pet - 圖片網址產生工具</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fdf5e6; color: #5C3A00; padding: 40px 20px; display: flex; justify-content: center; }
        .upload-container { background: white; padding: 30px; width: 100%; max-width: 450px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        .drop-zone { border: 2px dashed #FFD27F; padding: 30px; border-radius: 12px; background: #fffcf7; cursor: pointer; }
        .preview-img { max-width: 100%; max-height: 200px; margin-top: 15px; border-radius: 8px; display: none; margin-left: auto; margin-right: auto; }
        button { width: 100%; padding: 14px; background: #FFD27F; border: none; border-radius: 25px; font-size: 1.1rem; font-weight: bold; color: #5C3A00; cursor: pointer; margin-top: 20px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .result-box { margin-top: 20px; display: none; }
        .url-display { width: 100%; padding: 10px; background: #f4f4f4; border: 1px solid #ddd; border-radius: 6px; font-size: 0.8rem; box-sizing: border-box; text-align: left; word-break: break-all; max-height: 100px; overflow-y: auto; color: #333; }
        #status-msg { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
<div class="upload-container">
    <h2>🐾 圖片網址產生工具</h2>
    <p style="font-size: 0.9rem; color: #8B7355;">選取照片 ➔ 自動轉換網址 ➔ 自動複製 ➔ 貼回 Sheets</p>
    <div class="drop-zone" onclick="document.getElementById('file-input').click()">
        <span style="font-size: 2.5rem;">📷</span>
        <p style="margin: 10px 0 0 0; font-weight: bold;">點擊選擇相簿照片</p>
        <input type="file" id="file-input" accept="image/*" style="display:none;">
        <img id="image-preview" class="preview-img" alt="圖片預覽">
    </div>
    <button id="upload-btn" disabled>⚡ 產生圖片網址並複製</button>
    <div id="status-msg"></div>
    <div class="result-box" id="result-box">
        <p style="font-weight: bold; text-align: left; margin-bottom: 5px;">圖片網址（已複製到剪貼簿）：</p>
        <div class="url-display" id="url-output"></div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('file-input');
    const previewImg = document.getElementById('image-preview');
    const uploadBtn = document.getElementById('upload-btn');
    const statusMsg = document.getElementById('status-msg');
    const resultBox = document.getElementById('result-box');
    const urlOutput = document.getElementById('url-output');
    let selectedFile = null;

    fileInput.addEventListener('change', e => {
        selectedFile = e.target.files[0];
        if (selectedFile) {
            const reader = new FileReader();
            reader.onload = e => { 
                previewImg.src = e.target.result; 
                previewImg.style.display = 'block'; 
                uploadBtn.disabled = false; 
                statusMsg.innerText = ""; 
                resultBox.style.display = 'none'; 
            };
            reader.readAsDataURL(selectedFile);
        }
    });

    uploadBtn.addEventListener('click', () => {
        if (!selectedFile) return;
        uploadBtn.disabled = true;
        statusMsg.style.color = "#5C3A00";
        statusMsg.innerText = "正在處理圖片網址...";

        // 將圖片壓縮並轉換為可直接在網頁顯示的 Base64 Data URL
        const reader = new FileReader();
        reader.onload = function (e) {
            const img = new Image();
            img.onload = function() {
                // 建立 Canvas 自動做防卡頓優化與壓縮
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                const max_size = 800; // 限制最大寬高，避免字串過長

                if (width > height) {
                    if (width > max_size) {
                        height *= max_size / width;
                        width = max_size;
                    }
                } else {
                    if (height > max_size) {
                        width *= max_size / height;
                        height = max_size;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('canvas');
                ctx.drawImage(img, 0, 0, width, height);

                // 轉為輕量 JPG 格式 Data URL
                const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

                urlOutput.innerText = dataUrl;
                resultBox.style.display = 'block';
                statusMsg.style.color = "green";
                statusMsg.innerText = "🎉 圖片網址產生成功！已複製到剪貼簿。";

                copyToClipboard(dataUrl);
                uploadBtn.disabled = false;
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(selectedFile);
    });

    function copyToClipboard(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
        } catch (err) {
            console.error('複製失敗', err);
        }
        document.body.removeChild(textarea);
    }
</script>
</body>
</html>
