<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherry&Eason Pet | 寵物用品店</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="top"> 
<header class="header">
    <div class="header-top">
        <div class="logo">Cherry&Eason Pet</div>
        <span class="cart-icon" id="cart-icon" onclick="toggleCart()" style="cursor: pointer;">
            🛒 <span id="cart-count">0</span>
        </span>
    </div>

    <nav class="nav">
        <a href="#top">首頁</a> 
        <div class="dropdown">
            <a href="javascript:void(0)" class="dropbtn">商品分類 ▾</a>
            <div class="dropdown-content">
                <a href="javascript:void(0)" onclick="filterProducts('hot')">🔥 熱門商品</a>
                <a href="javascript:void(0)" onclick="filterProducts('all')">🌟 所有商品</a>
                <hr style="border: 0; border-top: 1px solid #eee; margin: 5px 0;">
                <a href="javascript:void(0)" onclick="filterProducts('cat-treats')">🐱 貓貓零食</a>
                <a href="javascript:void(0)" onclick="filterProducts('dog-treats')">🐶 狗狗零食</a>
                <a href="javascript:void(0)" onclick="filterProducts('cat-supplies')">🐈 貓貓用品</a>
                <a href="javascript:void(0)" onclick="filterProducts('dog-supplies')">🐕 狗狗用品</a>
            </div>
        </div>
        <a href="#about-section">品牌故事</a>
        <a href="#footer-section">聯絡我們</a>

        <div id="auth-section" style="display: inline-flex; align-items: center; gap: 10px; margin-left: 15px;">
            <img id="user-avatar" src="" style="display: none; width: 30px; height: 30px; border-radius: 50%; border: 1px solid #ddd;">
            <span id="user-info" style="font-size: 14px; color: #5C3A00;">訪客您好</span>
            <button id="auth-btn" onclick="handleAuth()" style="padding: 5px 12px; font-size: 12px; border-radius: 15px; cursor: pointer; background: #5C3A00; color: white; border: none;">Google 登入</button>
        </div>
    </nav>
    <div class="search-bar">
        <input type="text" id="product-search" placeholder="搜尋商品名稱...">
    </div>
</header>

<main id="shop" class="shop-container">
    <div class="container">
        <h2 id="current-category-name" style="text-align: center; color: #5C3A00; margin-top: 40px;">🌟 精選所有商品</h2>
        <div id="product-grid" class="product-grid"></div>
    </div>
</main>

<div id="checkout-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
    <div style="background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 450px; position: relative; max-height: 85vh; overflow-y: auto;">
        <h3 style="margin-top:0; color:#5C3A00;">📋 填寫訂購資訊</h3>
        <form id="checkout-form">
            <input type="text" id="name" placeholder="收件人姓名" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;" required>
            <input type="tel" id="phone" placeholder="聯絡電話" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;" required>
            <input type="email" id="email" placeholder="電子郵件" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;" required>
            
            <select id="delivery-method" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;" required>
                <option value="" disabled selected>請選擇取貨方式</option>
                <option value="宅配/郵寄">🏠 宅配/郵寄</option>
                <option value="超商取貨">🏪 超商取貨</option>
            </select>

            <div id="address-section" style="display:none;"><input type="text" id="address" placeholder="完整收件地址" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;"></div>
            <div id="store-section" style="display:none;"><input type="text" id="store-info" placeholder="超商店名與店號" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;"></div>

            <select id="payment-method" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;" required>
                <option value="" disabled selected>請選擇付款方式</option>
                <option value="貨到付款">🚚 貨到付款</option>
                <option value="銀行轉帳">🏦 銀行轉帳</option>
            </select>

            <div id="transfer-info" style="display:none; background:#fff9e6; padding:10px; border-radius:8px; margin-bottom:10px; font-size:13px;">
                國泰世華 (013) 帳號：2565-0632-6359
            </div>

            <textarea id="order-note" placeholder="訂單備註..." style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ddd; border-radius:8px;"></textarea>

            <button type="button" id="submit-btn" onclick="submitOrder()" style="width:100%; padding:14px; background:#5C3A00; color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">🚀 確認送出訂單</button>
            <button type="button" onclick="closeModal()" style="width:100%; padding:10px; background:#eee; border:none; border-radius:8px; margin-top:10px; cursor:pointer;">返回購物車</button>
        </form>
    </div>
</div>

<footer id="footer-section">
    <p>© 2026 Cherry&Eason Pet. All Rights Reserved.</p>
</footer>

<div id="cart-sidebar" class="cart-panel"></div>
<div id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDf663zw1zdWVCuPkN9hqtIQTE6dI4zaog",
    authDomain: "cherryeason-pet.firebaseapp.com",
    projectId: "cherryeason-pet",
    storageBucket: "cherryeason-pet.firebasestorage.app",
    messagingSenderId: "1025273907073",
    appId: "1:1025273907073:web:b4c2c3451fc5de9ffe0a80",
    measurementId: "G-RC10R4MGXM"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();
  
  // 重要：將 Firebase 實例掛載到全域 window 物件，讓外部的 cart.js 能存取
  window.firebaseAuth = auth;
  window.db = db;
  window.firestoreTools = { collection, addDoc, serverTimestamp };

  window.handleAuth = async () => {
    if (!auth.currentUser) {
      try { await signInWithPopup(auth, provider); } 
      catch (e) { alert("登入失敗"); }
    } else {
      if(confirm("確定要登出嗎？")) await signOut(auth);
    }
  };

  onAuthStateChanged(auth, (user) => {
    const infoEl = document.getElementById('user-info');
    const btnEl = document.getElementById('auth-btn');
    const avatarEl = document.getElementById('user-avatar');
    if (user) {
      infoEl.innerText = `Hi, ${user.displayName}`;
      btnEl.innerText = "登出";
      if (avatarEl && user.photoURL) { avatarEl.src = user.photoURL; avatarEl.style.display = "inline-block"; }
    } else {
      infoEl.innerText = "訪客您好";
      btnEl.innerText = "Google 登入";
      if (avatarEl) avatarEl.style.display = "none";
    }
  });
</script>
<script src="cart.js"></script>
</body>
</html>
